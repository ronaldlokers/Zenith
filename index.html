<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- One colour, no media branch: Zenith is light-only, and a dark
         theme-color put navy browser chrome above a Bone app on any device
         set to dark. Bone is what body paints (--bg), so the chrome and the
         page agree. -->
    <meta name="theme-color" content="#f4f2ec" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Zenith</title>
    <!-- The faces are discovered only after index.css parses, so first paint
         lands before they are even requested and the swap reflows every figure
         behind it: the fallback sets digits 14% narrower than Atkinson, and the
         largest type in the app is numbers (#501). -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/atkinson-next-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/atkinson-mono-latin.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
