name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    # Observed 5.7-9.25 min over recent runs (incl. a failing one that ran
    # to 555s before failing coverage/e2e). ~3x headroom over the worst of
    # those. This is the required status check for merging main — a timeout
    # here blocks every PR, so it needs real margin over a normal slow day.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check generated Worker types are up to date
        run: npx wrangler types --check

      - name: Typecheck and build
        run: npm run build

      - name: API integration tests
        run: npm test

      - name: Coverage floor
        run: npm run coverage

      - name: Install Chromium for the browser suite
        run: npx playwright install --with-deps chromium

      - name: Browser journeys and accessibility
        run: npm run e2e

  preview:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    # Observed ~26-30s. Generous headroom (not the 2-3x rule of thumb) because
    # this job depends on the npm registry and the Cloudflare API, either of
    # which can stall well past its own normal runtime without the job itself
    # being unhealthy.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vite build

      - name: Upload preview version
        id: preview
        run: |
          OUTPUT=$(npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" --message "PR #${{ github.event.pull_request.number }}")
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oE 'https://pr-[^ ]+\.workers\.dev' | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const url = `${{ steps.preview.outputs.url }}`;
            const body = url
              ? `Preview deployed (behind Cloudflare Access, same as production): ${url}`
              : "Preview upload ran but no preview URL was found in the wrangler output — check the workflow log.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
